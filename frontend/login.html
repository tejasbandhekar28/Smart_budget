<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Finance Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <div class="logo">
        <div class="logo-icon"><i class="ph ph-wallet"></i></div>
      </div>
      <h2>Welcome Back</h2>
      <p>Enter your credentials to access your account</p>
    </div>
    
    <div id="login-alert" class="alert-message alert-error"></div>

    <form id="login-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com">
        <div class="form-error" id="email-error">Please enter a valid email.</div>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" required placeholder="Enter your password">
          <button type="button" class="toggle-password" onclick="togglePassword('password')">
            <i class="ph ph-eye" id="password-eye"></i>
          </button>
        </div>
        <div class="form-error" id="password-error">Password is required.</div>
      </div>

      <div class="auth-actions">
        <label class="remember-me">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="#" style="color: var(--primary-blue); text-decoration: none; font-weight: 500;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-primary auth-btn" id="login-submit">
        <div class="spinner"></div> Login
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign up</a>
    </div>
  </div>
</div>

<script>
  function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const eyeIcon = document.getElementById(inputId + '-eye');
    if (input.type === 'password') {
      input.type = 'text';
      eyeIcon.classList.replace('ph-eye', 'ph-eye-slash');
    } else {
      input.type = 'password';
      eyeIcon.classList.replace('ph-eye-slash', 'ph-eye');
    }
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('login-submit');
    
    // Reset errors
    email.classList.remove('input-error');
    password.classList.remove('input-error');
    emailError.style.display = 'none';
    passwordError.style.display = 'none';
    alertBox.style.display = 'none';
    
    let isValid = true;
    
    // Validate email
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email.value)) {
      email.classList.add('input-error');
      emailError.style.display = 'block';
      isValid = false;
    }
    
    // Validate password
    if (!password.value) {
      password.classList.add('input-error');
      passwordError.style.display = 'block';
      isValid = false;
    }
    
    if (!isValid) return;
    
    // Loading state
    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: password.value })
      });
      
      const data = await res.json();
      
      if (!res.ok) {
        throw new Error(data.error || 'Failed to login');
      }
      
      // Success - store token and redirect based on role
      localStorage.setItem('budget_token', data.token);
      localStorage.setItem('budget_user', JSON.stringify(data.user));
      
      alertBox.textContent = 'Login successful! Redirecting...';
      alertBox.className = 'alert-message alert-success';
      alertBox.style.display = 'block';
      
      setTimeout(() => {
        if (data.user.role === 'admin') {
          window.location.href = 'index.html?role=admin';
        } else {
          window.location.href = 'index.html';
        }
      }, 1000);
      
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.className = 'alert-message alert-error';
      alertBox.style.display = 'block';
    } finally {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
